[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "devex-metrics"
version = "0.1.0"
description = "DORA metrics collector using the GitHub API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "responses"]

[project.scripts]
devex-metrics = "devex_metrics.cli:main"
